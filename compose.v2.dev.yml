services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classops
      POSTGRES_USER: classops
      POSTGRES_PASSWORD: classops_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - classops_v2_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classops -d classops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  classops_v2_postgres:
