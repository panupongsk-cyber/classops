server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client address. Every request arrives from the Docker bridge (the host's published
    # 127.0.0.1:8080, fed by cloudflared). Cloudflare's edge appends the client address it saw as
    # the *last* X-Forwarded-For entry; earlier entries are client-supplied and untrusted. So trust
    # only the bridge/loopback peer, and take the last entry, not a recursive walk. Verified at the
    # deployed boundary on 2026-09-25 (PS-TASK-20260925-727). Without the header (local runs),
    # $remote_addr stays the peer.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Same-origin API proxy — the browser never talks to the API container directly.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, don't append: the API (TRUST_PROXY=172.16.0.0/12) reads this one resolved address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location /health {
        proxy_pass http://api:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Single-page app: unmatched paths fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
