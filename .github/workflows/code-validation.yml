name: Code validation

on:
  pull_request:
    paths:
      - "src/**"
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/code-validation.yml"

permissions:
  contents: read

jobs:
  server-typecheck-and-test:
    name: server-typecheck-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm run typecheck
      - working-directory: server
        run: npm test

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build legacy bundle
        run: npx vite build
      - name: Build v2 bundle
        run: npx vite build
        env:
          VITE_AUTH_MODE: v2
